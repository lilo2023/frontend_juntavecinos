version: '3.8'

# ====================================================================
# DOCKER COMPOSE - ORQUESTADOR MULTI-CONTENEDOR SAAS JUNTA DE VECINOS
# ====================================================================

services:
  # ------------------------------------------------------------------
  # SERVICIO 1: Base de Datos NoSQL MongoDB (Red Privada Interna)
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: jvv-mongodb-privado
    restart: always
    environment:
      MONGO_INITDB_DATABASE: juntavecinos
    volumes:
      - mongo-db-data:/data/db
    networks:
      - jvv-red-privada
    # Nota: No expone puertos hacia afuera para máxima seguridad

  # ------------------------------------------------------------------
  # SERVICIO 2: Servidor Backend REST API (Node.js + Express + Puppeteer)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ../backend-junta-vecinos
      dockerfile: Dockerfile
    container_name: jvv-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/juntavecinos
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - jvv-red-privada

  # ------------------------------------------------------------------
  # SERVICIO 3: Cliente Frontend Web (React SPA + Nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvv-frontend-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - jvv-red-privada

# --------------------------------------------------------------------
# VOLÚMENES PERSISTENTES
# --------------------------------------------------------------------
volumes:
  mongo-db-data:
    driver: local

# --------------------------------------------------------------------
# REDES PRIVADAS VIRTUALES
# --------------------------------------------------------------------
networks:
  jvv-red-privada:
    driver: bridge
